<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10140c"><meta name="description" content="植物大战僵尸网页基础版：经典界面、白天冒险与无尽生存。"><title>植物大战僵尸 · 网页基础版</title><link rel="stylesheet" href="style.css?v=db20463b25a0"></head><body>

<main><section id="home" hidden><div class="menu-scene"><h1 class="sr-only">植物大战僵尸</h1><img class="menu-logo" src="assets/ui/LogoWord.jpg" alt="植物大战僵尸"><div class="welcome-sign"><p>欢迎来到你的草坪</p><span id="saveInfo"></span></div><button id="continueBtn" class="adventure-button" aria-label="开始冒险"><span class="sr-only">开始冒险</span></button><button id="endlessBtn" class="menu-stone endless-stone">无尽生存</button><button id="levelsBtn" class="menu-stone levels-stone">选择关卡</button><button id="almanacBtn" class="almanac-button" aria-label="植物僵尸图鉴"></button><div class="menu-bottom"><button id="optionsBtn" aria-label="选项"><span class="sr-only">选项</span></button><button id="menuHelpBtn" aria-label="帮助"><span class="sr-only">帮助</span></button><button id="replayIntroBtn" aria-label="返回启动界面"><span class="sr-only">返回启动界面</span></button></div><div class="menu-version">白天冒险 · 10 关</div></div><footer><a href="game-offline.html" download>下载离线版</a><a href="game-source.zip" download>下载完整项目</a><a href="ASSET_SOURCES.md">素材来源</a></footer></section>
<section id="levelSelect" hidden><div class="level-scene"><div class="map-heading"><h2>白天冒险</h2><button id="backLevels">返回菜单</button></div><p class="level-description">从一小片草坪开始，守住你的家。</p><div id="levels" class="levels"></div><p class="footnote">夜晚、泳池等场景将在后续版本开放。</p></div></section>
<section id="play" hidden><div class="game-heading"><strong id="levelTitle"></strong><div><button id="speedBtn">1×</button><button id="gridBtn">辅助网格</button><button id="pauseBtn">暂停</button><button id="menuBtn">菜单</button></div></div><div class="battlefield"><canvas id="board" width="1100" height="600" aria-label="五行九列种植战场"></canvas><div class="seed-bank"><div class="sun-counter"><img src="assets/Sun.png" alt=""><strong id="sunValue">50</strong></div><div id="cards" class="cards" aria-label="植物种子卡"></div><button id="shovelBtn" class="shovel" title="铲除植物"><img src="assets/shovelIcon.png" alt="铲子"></button></div><button id="skipIntroBtn" class="skip-intro" hidden>跳过动画</button><div class="wave-hud"><span id="waveLabel">准备阶段</span><div class="track"><i id="waveFill"></i><img class="flag-head" src="assets/ui/FlagMeterParts1.png" alt=""><img class="flag-end" src="assets/ui/FlagMeterParts2.png" alt=""></div></div><div id="overlay" class="overlay" hidden><div class="dialog"><p id="overlayTag">草坪保卫战</p><h2 id="overlayTitle"></h2><p id="overlayText"></p><div id="overlayButtons"></div></div></div></div><div class="bottom-bar"><span id="hint">点击阳光收集。</span><button id="autoBtn">自动收光：关</button></div><p class="controls">点种子卡，再点草地种植。1–9 选卡 · S 铲子 · 空格暂停 · Esc 取消选择。触屏建议横屏。</p></section></main>
<div id="toast" role="status"></div><dialog id="help"><div class="help-heading"><h2>植物与僵尸图鉴</h2><button id="closeHelp">关闭</button></div><p class="help-copy">收集阳光，选择种子卡，再点草地种植。每条路线有一次割草机救场。铲除植物不退阳光，土豆地雷需要提前布置。</p><div class="codex-tabs"><button id="plantTab" aria-pressed="true">植物</button><button id="zombieTab" aria-pressed="false">僵尸</button></div><div id="codex" class="codex"></div><div id="enemyCodex" class="enemy-codex" hidden></div></dialog>
<dialog id="settings"><div class="settings-content"><h2>游戏选项</h2><button id="settingsSound">声音：关</button><button id="settingsAuto">自动收光：关</button><button id="settingsGrid">辅助网格：关</button><p>游戏进度自动保存在此浏览器</p><button id="closeSettings" class="stone-wide">返回游戏</button></div></dialog>
